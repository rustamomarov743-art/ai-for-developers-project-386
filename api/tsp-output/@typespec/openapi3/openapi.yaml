openapi: 3.0.0
info:
  title: Call Calendar API
  version: 0.0.0
tags: []
paths:
  /api/health:
    get:
      operationId: getHealth
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/owner/availability:
    get:
      operationId: getAvailability
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    put:
      operationId: replaceAvailability
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceAvailabilityRequest'
  /api/owner/meeting-types:
    get:
      operationId: listMeetingTypes
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingType'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      operationId: createMeetingType
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingType'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMeetingTypeRequest'
components:
  schemas:
    ApiFieldError:
      type: object
      required:
        - path
        - message
      properties:
        path:
          type: string
        message:
          type: string
    Availability:
      type: object
      required:
        - exists
      properties:
        exists:
          type: boolean
        timeZone:
          type: string
        version:
          type: integer
          format: int32
        weeklyTemplate:
          $ref: '#/components/schemas/WeeklyTemplate'
    CreateMeetingTypeRequest:
      type: object
      required:
        - name
        - description
        - durationMinutes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 1000
        durationMinutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 1440
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
    MeetingType:
      type: object
      required:
        - id
        - name
        - description
        - durationMinutes
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiFieldError'
    ReplaceAvailabilityRequest:
      type: object
      required:
        - timeZone
        - expectedVersion
        - weeklyTemplate
      properties:
        timeZone:
          type: string
        expectedVersion:
          type: integer
          format: int32
          nullable: true
        weeklyTemplate:
          $ref: '#/components/schemas/WeeklyTemplate'
    TimeInterval:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        end:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
    WeeklyTemplate:
      type: object
      required:
        - MONDAY
        - TUESDAY
        - WEDNESDAY
        - THURSDAY
        - FRIDAY
        - SATURDAY
        - SUNDAY
      properties:
        MONDAY:
          type: array
          items:
            $ref: '#/components/schemas/TimeInterval'
        TUESDAY:
          type: array
          items:
            $ref: '#/components/schemas/TimeInterval'
        WEDNESDAY:
          type: array
          items:
            $ref: '#/components/schemas/TimeInterval'
        THURSDAY:
          type: array
          items:
            $ref: '#/components/schemas/TimeInterval'
        FRIDAY:
          type: array
          items:
            $ref: '#/components/schemas/TimeInterval'
        SATURDAY:
          type: array
          items:
            $ref: '#/components/schemas/TimeInterval'
        SUNDAY:
          type: array
          items:
            $ref: '#/components/schemas/TimeInterval'
servers:
  - url: http://localhost:8080
    description: Local development
    variables: {}
